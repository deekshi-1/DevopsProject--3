adminPassword: admin

service:
  type: NodePort
  nodePort: 32000


datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true


dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: default
      orgId: 1
      folder: Kubernetes
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default


dashboards:
  default:

    kubernetes-cluster:
      gnetId: 315
      revision: 3
      datasource: Prometheus

    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus

    nginx-dashboard:
      gnetId: 12708
      revision: 1
      datasource: Prometheus