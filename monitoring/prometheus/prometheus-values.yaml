defaultRules:
  create: true
  rules:
    # Disable noisy default rules
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeScheduler: false
    kubeProxy: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverSlos: false
    kubePrometheusGeneral: false
    kubePrometheusNodeRecording: false
    kubernetesSystem: false
    kubernetesSystemControllerManager: false
    kubernetesSystemScheduler: false
    node: false
    nodeExporterRecording: false
    prometheus: false
    prometheusOperator: false


alertmanager:
  enabled: true


kubeStateMetrics:
  enabled: true


nodeExporter:
  enabled: true


server:
  persistentVolume:
    enabled: false


additionalPrometheusRulesMap:
  capstone-alerts:
    groups:
      - name: capstone-alerts
        rules:

        - alert: HighCPUUsage
          expr: |
            100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High CPU usage detected


        - alert: PodCrashLoopBackOff
          expr: |
            rate(kube_pod_container_status_restarts_total[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Pod restarting


        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes node not ready