defaultRules:
  create: false

# Alertmanager
alertmanager:
  enabled: true

# kube-state-metrics
kubeStateMetrics:
  enabled: true

# Node Exporter
nodeExporter:
  enabled: true

# Prometheus
prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    ruleSelector:
      matchLabels: {}

    serviceMonitorSelector: {}

    podMonitorSelector: {}

    storageSpec: {}

# Disable persistent storage (Lab)
server:
  persistentVolume:
    enabled: false

# Custom Alert Rules
additionalPrometheusRulesMap:

  capstone-alerts:

    groups:

      - name: capstone-alerts

        rules:

          # High CPU Usage (>50% for 1 minute)
          - alert: HighCPUUsage
            expr: |
              100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 50
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: High CPU usage detected
              description: Node CPU usage is above 50% for more than 1 minute.

          # Pod Restart
          - alert: PodCrashLoopBackOff
            expr: |
              rate(kube_pod_container_status_restarts_total[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Pod restarting
              description: A container has restarted recently.

          # Node Not Ready
          - alert: NodeNotReady
            expr: |
              kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Kubernetes node not ready
              description: A Kubernetes node has been NotReady for more than 1 minute.